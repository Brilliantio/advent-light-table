<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Advent Cover Light Table</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b1220;
  --panel: #121a2b;
  --text: #e8eefc;
  --muted: #9fb0d0;
  --border: #243149;
  --hold: #f59e0b;
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
  background: var(--bg); color: var(--text);
}
header {
  position: sticky; top: 0; z-index: 5;
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  padding: 14px 18px; background: rgba(11,18,32,.92); border-bottom: 1px solid var(--border);
  backdrop-filter: blur(8px);
}
h1 { font-size: 16px; margin: 0; font-weight: 650; }
.subhead { width: 100%; font-size: 12px; color: var(--muted); }
.hold-banner {
  width: 100%; padding: 10px 12px; border-radius: 10px;
  background: color-mix(in srgb, var(--hold) 18%, transparent);
  border: 1px solid color-mix(in srgb, var(--hold) 45%, transparent);
  font-size: 13px; line-height: 1.4;
}
.hold-banner strong { color: #fcd34d; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
button, select {
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 10px; cursor: pointer;
}
button.active { outline: 2px solid #60a5fa; }
main { padding: 16px; }
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px;
}
.card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
  overflow: hidden; cursor: pointer; border-top: 4px solid var(--state);
}
.card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #000; }
.card img.missing { opacity: .35; filter: grayscale(1); }
.meta { padding: 10px 12px 12px; }
.badge {
  display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 999px;
  background: color-mix(in srgb, var(--state) 25%, transparent); color: var(--text);
  border: 1px solid color-mix(in srgb, var(--state) 55%, transparent);
}
.rank { color: var(--muted); font-size: 12px; }
.title { font-size: 13px; margin: 6px 0 0; line-height: 1.3; }
.drawer-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 20;
}
.drawer-bg.open { display: block; }
.drawer {
  position: fixed; top: 0; right: 0; height: 100%; width: min(440px, 100%);
  background: #0f172a; border-left: 1px solid var(--border); transform: translateX(100%);
  transition: transform .2s ease; z-index: 21; overflow: auto; padding: 18px;
}
.drawer.open { transform: translateX(0); }
.drawer img { width: 100%; border-radius: 10px; }
.drawer h2 { margin: 0 0 8px; font-size: 18px; }
.drawer p { color: var(--muted); font-size: 14px; line-height: 1.45; }
.variants { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.variants button { padding: 4px 8px; }
a { color: #93c5fd; }
.queue { display: none; max-width: 720px; }
.queue.show { display: block; }
.queue-item {
  display: flex; gap: 12px; align-items: center; padding: 10px; border: 1px solid var(--border);
  border-radius: 12px; margin-bottom: 8px; background: var(--panel); cursor: pointer;
}
.queue-item img { width: 54px; height: 81px; object-fit: cover; border-radius: 6px; }
.loading { padding: 24px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Advent Cover Light Table · priority cockpit</h1>
  <div class="subhead">Brilliantio · Mastermind share · craft eye-on only · not list-ready · images via Cloudinary CDN</div>
  <div id="holdBanner" class="hold-banner" hidden></div>
  <div class="filters">
    <button id="viewGrid" class="active">Grid</button>
    <button id="viewQueue">Priority queue</button>
    <select id="stateFilter">
      <option value="all">All states</option>
      <option value="shortlist">Shortlist</option>
      <option value="hold">Hold</option>
      <option value="craft">Craft</option>
    </select>
    <select id="idFilter"><option value="all">All concepts</option></select>
  </div>
</header>
<main>
  <div id="loading" class="loading">Loading gallery…</div>
  <div id="grid" class="grid" hidden></div>
  <div id="queue" class="queue"></div>
</main>
<div class="drawer-bg" id="bg"></div>
<aside class="drawer" id="drawer"></aside>
<script>
const CLOUDINARY_HOST = 'res.cloudinary.com';

let CARDS = [];
let IMAGE_MAP = {};
let mapStatus = 'hold';

function isCloudinaryUrl(url) {
  return typeof url === 'string' && url.startsWith('https://') && url.includes(CLOUDINARY_HOST);
}

function resolveImage(key) {
  const entry = IMAGE_MAP[key];
  if (!entry) return null;
  if (typeof entry === 'string') return isCloudinaryUrl(entry) ? entry : null;
  const url = entry.secure_url || entry.url;
  return isCloudinaryUrl(url) ? url : null;
}

function hydrateCards(cards) {
  return cards.map(c => {
    const variants = c.variants.map(v => ({ ...v, src: resolveImage(v.key) }));
    const hero = resolveImage(c.heroKey) || variants.find(v => v.src)?.src || null;
    return { ...c, hero, variants };
  });
}

function showHoldBanner(manifest, map) {
  const el = document.getElementById('holdBanner');
  const mapped = Object.values(map.images || {}).filter(isCloudinaryUrl).length;
  const total = Object.keys(map.images || {}).length;
  const target = manifest.conceptCountTarget || CARDS.length;
  el.hidden = false;
  el.innerHTML = `<strong>CDN HOLD</strong> — ${map.note || 'Awaiting Cloudinary secure_url map.'} `
    + `Concepts loaded: <strong>${CARDS.length}/${target}</strong>. `
    + `Images mapped: <strong>${mapped}/${total}</strong>. `
    + `Excluded on Desktop: Laugh-Off · Impossible Questions.`;
}

async function boot() {
  const [manifestRes, mapRes] = await Promise.all([
    fetch('cards.json'),
    fetch('cloudinary-map.json'),
  ]);
  if (!manifestRes.ok || !mapRes.ok) throw new Error('Failed to load gallery data');
  const manifest = await manifestRes.json();
  const map = await mapRes.json();
  mapStatus = map.status || 'hold';
  IMAGE_MAP = map.images || {};
  CARDS = hydrateCards(manifest.cards || []);
  if (mapStatus === 'hold' || Object.values(IMAGE_MAP).some(v => v == null)) {
    showHoldBanner(manifest, map);
  }
  document.getElementById('loading').hidden = true;
  document.getElementById('grid').hidden = false;
  initUI();
}

const grid = document.getElementById('grid');
const queue = document.getElementById('queue');
const drawer = document.getElementById('drawer');
const bg = document.getElementById('bg');
const idFilter = document.getElementById('idFilter');
const stateFilter = document.getElementById('stateFilter');

function initUI() {
  idFilter.innerHTML = '<option value="all">All concepts</option>';
  CARDS.forEach(c => {
    const o = document.createElement('option');
    o.value = c.id; o.textContent = c.id;
    idFilter.appendChild(o);
  });
  render();
}

function filtered() {
  return CARDS.filter(c => {
    if (idFilter.value !== 'all' && c.id !== idFilter.value) return false;
    if (stateFilter.value !== 'all' && c.state !== stateFilter.value) return false;
    return true;
  });
}

function imgTag(src, alt, cls) {
  if (src) return `<img src="${src}" alt="${alt}" loading="lazy" class="${cls || ''}" />`;
  return `<img alt="${alt} (awaiting Cloudinary)" class="missing ${cls || ''}" />`;
}

function openCard(c, variantSrc) {
  const src = variantSrc || c.hero;
  drawer.innerHTML = `
    <div class="badge" style="--state:${c.color}">${c.state}</div>
    <div class="rank">Priority #${c.rank} · preferred ${c.preferredVariant}</div>
    <h2>${c.id}</h2>
    <p><strong>${c.name}</strong></p>
    ${src ? `<img id="heroImg" src="${src}" alt="${c.id}" />` : `<p><em>Cover awaiting Cloudinary secure_url</em></p>`}
    <div class="variants">${c.variants.map(v => `<button data-src="${v.src || ''}" data-key="${v.key}" ${v.src ? '' : 'disabled'}>${v.label}</button>`).join('')}</div>
    <p><strong>Why this priority</strong><br>${c.why || '—'}</p>
    <p>${c.summary || ''}</p>
    ${c.url ? `<p><a href="${c.url}" target="_blank" rel="noopener">Open Linear project</a></p>` : ''}
    <p style="font-size:12px;color:#7c8db0">File key: ${c.heroKey}</p>
  `;
  drawer.querySelectorAll('.variants button').forEach(b => {
    if (!b.dataset.src) return;
    b.onclick = () => {
      const img = document.getElementById('heroImg');
      if (img) img.src = b.dataset.src;
    };
  });
  drawer.classList.add('open'); bg.classList.add('open');
}
bg.onclick = () => { drawer.classList.remove('open'); bg.classList.remove('open'); };

function render() {
  const list = filtered();
  grid.innerHTML = list.map(c => `
    <article class="card" style="--state:${c.color}" data-id="${c.id}">
      ${imgTag(c.hero, c.id)}
      <div class="meta">
        <span class="badge" style="--state:${c.color}">${c.state}</span>
        <div class="rank">#${c.rank} · ${c.id} · ${c.preferredVariant}</div>
        <div class="title">${c.name}</div>
      </div>
    </article>`).join('');
  grid.querySelectorAll('.card').forEach(el => {
    const c = CARDS.find(x => x.id === el.dataset.id);
    el.onclick = () => openCard(c);
  });
  queue.innerHTML = list.map(c => `
    <div class="queue-item" data-id="${c.id}" style="border-left:4px solid ${c.color}">
      ${imgTag(c.hero, '', '')}
      <div>
        <div class="badge" style="--state:${c.color}">${c.state}</div>
        <div><strong>#${c.rank} ${c.id}</strong></div>
        <div style="color:#9fb0d0;font-size:13px">${c.why}</div>
      </div>
    </div>`).join('');
  queue.querySelectorAll('.queue-item').forEach(el => {
    const c = CARDS.find(x => x.id === el.dataset.id);
    el.onclick = () => openCard(c);
  });
}

document.getElementById('viewGrid').onclick = (e) => {
  e.target.classList.add('active'); document.getElementById('viewQueue').classList.remove('active');
  grid.style.display = 'grid'; queue.classList.remove('show');
};
document.getElementById('viewQueue').onclick = (e) => {
  e.target.classList.add('active'); document.getElementById('viewGrid').classList.remove('active');
  grid.style.display = 'none'; queue.classList.add('show');
};
idFilter.onchange = stateFilter.onchange = render;

boot().catch(err => {
  document.getElementById('loading').textContent = 'Failed to load gallery: ' + err.message;
});
</script>
</body>
</html>
